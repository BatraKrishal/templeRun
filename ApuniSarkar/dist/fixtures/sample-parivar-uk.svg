<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <!-- Parivar Register Nakal Mock Card -->
  <rect x="0" y="0" width="600" height="380" rx="16" fill="#FBFBF7" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="12" y="12" width="576" height="356" rx="10" fill="none" stroke="#94a3b8" stroke-dasharray="6,4"/>

  <!-- Watermark -->
  <g transform="rotate(-20 300 190)" opacity="0.12">
    <text x="300" y="170" font-family="sans-serif" font-size="26" font-weight="900" fill="#dc2626" text-anchor="middle">
      PRAYAS 2026 DEMO FIXTURE
    </text>
    <text x="300" y="205" font-family="sans-serif" font-size="16" font-weight="700" fill="#dc2626" text-anchor="middle">
      SAMPLE GRAM PANCHAYAT RECORD
    </text>
  </g>

  <!-- Header -->
  <rect x="18" y="18" width="564" height="65" rx="6" fill="#0F2942"/>
  <text x="300" y="44" font-family="'Noto Sans Devanagari', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">
    कार्यालय ग्राम पंचायत विकास अधिकारी (VPDO)
  </text>
  <text x="300" y="66" font-family="'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="600" fill="#FF9933" text-anchor="middle">
    पंचायती राज विभाग, उत्तराखण्ड शासन — परिवार रजिस्टर की नकल (प्रपत्र-4)
  </text>

  <!-- Location Badges -->
  <g transform="translate(30, 95)">
    <rect x="0" y="0" width="165" height="36" rx="6" fill="#e2e8f0"/>
    <text x="10" y="15" font-family="sans-serif" font-size="9" fill="#64748b">जनपद / DISTRICT</text>
    <text x="10" y="30" font-family="'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="700" fill="#0f172a">देहरादून (Dehradun)</text>

    <rect x="180" y="0" width="165" height="36" rx="6" fill="#e2e8f0"/>
    <text x="190" y="15" font-family="sans-serif" font-size="9" fill="#64748b">विकासखण्ड / BLOCK</text>
    <text x="190" y="30" font-family="'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="700" fill="#0f172a">रायपुर (Raipur)</text>

    <rect x="360" y="0" width="180" height="36" rx="6" fill="#e2e8f0"/>
    <text x="370" y="15" font-family="sans-serif" font-size="9" fill="#64748b">ग्राम पंचायत / GRAM PANCHAYAT</text>
    <text x="370" y="30" font-family="'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="700" fill="#0f172a">रायपुर (Raipur)</text>
  </g>

  <!-- Head of Family Block -->
  <rect x="30" y="145" width="540" height="50" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="45" y="165" font-family="sans-serif" font-size="10" font-weight="600" fill="#15803D">परिवार के मुखिया का नाम (HEAD OF FAMILY):</text>
  <text x="45" y="185" font-family="'Noto Sans Devanagari', sans-serif" font-size="16" font-weight="800" fill="#14532D">
    हरीश चंद्र जोशी / Harish Chandra Joshi (पुत्र: स्व० श्री दुर्गा दत्त जोशी)
  </text>

  <!-- Table of Family Members -->
  <g transform="translate(30, 205)">
    <!-- Table Header -->
    <rect x="0" y="0" width="540" height="26" fill="#1E293B" rx="4"/>
    <text x="15" y="17" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">क्र०</text>
    <text x="50" y="17" font-family="'Noto Sans Devanagari', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">सदस्य का नाम</text>
    <text x="190" y="17" font-family="'Noto Sans Devanagari', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">मुखिया से सम्बन्ध</text>
    <text x="320" y="17" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">लिंग / आयु</text>
    <text x="440" y="17" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">साक्षरता / कार्य</text>

    <!-- Row 1 -->
    <rect x="0" y="28" width="540" height="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.5"/>
    <text x="15" y="44" font-family="sans-serif" font-size="10" fill="#334155">1</text>
    <text x="50" y="44" font-family="'Noto Sans Devanagari', sans-serif" font-size="11" font-weight="600" fill="#0F172A">हरीश चंद्र जोशी</text>
    <text x="190" y="44" font-family="'Noto Sans Devanagari', sans-serif" font-size="10" fill="#334155">स्वयं (मुखिया)</text>
    <text x="320" y="44" font-family="sans-serif" font-size="10" fill="#334155">पु० / 54 वर्ष</text>
    <text x="440" y="44" font-family="sans-serif" font-size="10" fill="#334155">स्नातक / कृषक</text>

    <!-- Row 2 -->
    <rect x="0" y="53" width="540" height="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5"/>
    <text x="15" y="69" font-family="sans-serif" font-size="10" fill="#334155">2</text>
    <text x="50" y="69" font-family="'Noto Sans Devanagari', sans-serif" font-size="11" font-weight="600" fill="#0F172A">पुष्पा देवी जोशी</text>
    <text x="190" y="69" font-family="'Noto Sans Devanagari', sans-serif" font-size="10" fill="#334155">पत्नी</text>
    <text x="320" y="69" font-family="sans-serif" font-size="10" fill="#334155">स्त्री / 49 वर्ष</text>
    <text x="440" y="69" font-family="sans-serif" font-size="10" fill="#334155">इंटर / गृहणी</text>

    <!-- Row 3 -->
    <rect x="0" y="78" width="540" height="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.5"/>
    <text x="15" y="94" font-family="sans-serif" font-size="10" fill="#334155">3</text>
    <text x="50" y="94" font-family="'Noto Sans Devanagari', sans-serif" font-size="11" font-weight="600" fill="#0F172A">अमित जोशी</text>
    <text x="190" y="94" font-family="'Noto Sans Devanagari', sans-serif" font-size="10" fill="#334155">पुत्र</text>
    <text x="320" y="94" font-family="sans-serif" font-size="10" fill="#334155">पु० / 22 वर्ष</text>
    <text x="440" y="94" font-family="sans-serif" font-size="10" fill="#334155">बी०टेक / छात्र</text>
  </g>

  <!-- Summary Footer -->
  <g transform="translate(30, 320)">
    <rect x="0" y="0" width="260" height="35" rx="6" fill="#F1F5F9"/>
    <text x="12" y="16" font-family="sans-serif" font-size="9" fill="#64748b">कुल सदस्य संख्या (TOTAL MEMBERS)</text>
    <text x="12" y="30" font-family="sans-serif" font-size="13" font-weight="800" fill="#0F2942">5 सदस्य (पुरुष: 3, महिला: 2)</text>

    <rect x="280" y="0" width="260" height="35" rx="6" fill="#F1F5F9"/>
    <text x="12" y="16" font-family="sans-serif" font-size="9" fill="#64748b">प्रमाण पत्र क्रमांक व पृष्ठ सं०</text>
    <text x="12" y="30" font-family="sans-serif" font-size="12" font-weight="700" fill="#0F2942">पृष्ठ सं०: 42/B (वर्ष 2023-24)</text>
  </g>
</svg>

