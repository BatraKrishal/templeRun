# ==============================================================================
# Render.com Blueprint Configuration for Apuni Sarkar (VaaniSetu)
# Unified Full-Stack Service: Node.js Express Backend + React Vite SPA
# ==============================================================================

services:
  - type: web
    name: apuni-sarkar-vaanisetu
    runtime: node
    plan: free
    region: singapore # Closest region to India / Uttarakhand for minimum latency
    rootDir: ApuniSarkar
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ELEVENLABS_MODEL_ID
        value: eleven_multilingual_v2
      - key: ELEVENLABS_VOICE_ID
        value: Xb7hH8MSUJpSbSDYk0k2
      - key: KEY_ROTATION_THRESHOLD_CHARS
        value: "9500"

      # ElevenLabs 8-9 Accounts Key Pool (Provide in Render Dashboard)
      - key: ELEVENLABS_API_KEY_1
        sync: false
      - key: ELEVENLABS_EMAIL_1
        sync: false
      - key: ELEVENLABS_API_KEY_2
        sync: false
      - key: ELEVENLABS_EMAIL_2
        sync: false
      - key: ELEVENLABS_API_KEY_3
        sync: false
      - key: ELEVENLABS_EMAIL_3
        sync: false
      - key: ELEVENLABS_API_KEY_4
        sync: false
      - key: ELEVENLABS_EMAIL_4
        sync: false
      - key: ELEVENLABS_API_KEY_5
        sync: false
      - key: ELEVENLABS_EMAIL_5
        sync: false
      - key: ELEVENLABS_API_KEY_6
        sync: false
      - key: ELEVENLABS_EMAIL_6
        sync: false
      - key: ELEVENLABS_API_KEY_7
        sync: false
      - key: ELEVENLABS_EMAIL_7
        sync: false
      - key: ELEVENLABS_API_KEY_8
        sync: false
      - key: ELEVENLABS_EMAIL_8
        sync: false
      - key: ELEVENLABS_API_KEY_9
        sync: false
      - key: ELEVENLABS_EMAIL_9
        sync: false

      # Google Gemini (Intent Routing & Slot Extraction)
      - key: GEMINI_API_KEY
        sync: false

